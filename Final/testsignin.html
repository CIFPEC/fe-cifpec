<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login & Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <link href="./../assets/css/login.css" rel="stylesheet">

</head>

<body class="auth">

    <div class="form-box glass-box">
        <div class="d-flex mb-4">
            <button id="loginTab" class="btn btn-light btn-switch active w-50 me-3" onclick="showLogin()">LOGIN</button>
            <button id="registerTab" class="btn btn-light btn-switch w-50" onclick="showRegister()">REGISTER</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm">
            <div class="text-center mb-3 auth-logo">
                <img src="./../assets/img/Logo Cifpec.png">
            </div>
            <div class="mb-3">
                <input type="text" class="form-control" placeholder="Email or username">
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" placeholder="Password">
            </div>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Remember me</label>
                </div>
                <a href="#" class="text-decoration-none text-light">Forgot password?</a>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">SIGN IN</button>
        </form>
        <form id="registerForm" style="display: none;">
            <div class="text-center mb-3 auth-logo">
                <img src="./../assets/img/Logo Cifpec.png">
            </div>

            <div class="mb-3">
                <input type="text" class="form-control" placeholder="Name">
            </div>
            <div class="mb-3">
                <input type="text" class="form-control" placeholder="Username">
            </div>
            <div class="mb-3">
                <input type="email" class="form-control" placeholder="Email">
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" placeholder="Password">
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" placeholder="Repeat password">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">REGISTER</button>
        </form>
    </div>

    <script>
        function showLogin() {
            document.getElementById("loginForm").style.display = "block";
            document.getElementById("registerForm").style.display = "none";
            document.getElementById("loginTab").classList.add("active");
            document.getElementById("registerTab").classList.remove("active");
        }

        function showRegister() {
            document.getElementById("loginForm").style.display = "none";
            document.getElementById("registerForm").style.display = "block";
            document.getElementById("loginTab").classList.remove("active");
            document.getElementById("registerTab").classList.add("active");
        }
    </script>

</body>

</html>
