            <div class="row">
                <div class="col-12">
                    <div class="card">

                        <div class>
                            <div class="p-3">
                                <h6 class="mb-3">Setup Project Requirement</h6>

                                <form>
                                    <!-- Batch Name and Course Name -->
                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label class="form-label">Batch Name</label>
                                            <input type="text" class="form-control" placeholder="Enter batch name">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Course Name</label>
                                            <select class="form-select">
                                                <option>Select course</option>
                                                <option value="IT">IT</option>
                                                <option value="Meka">Meka</option>
                                                <option value="Puan">Puan</option>
                                            </select>
                                        </div>
                                    </div>

                                    <!-- Advance Optional -->
                                    <div class="mb-3 d-flex align-items-center">
                                        <label class="form-label me-2">Advance (Optional)</label>
                                        <input type="checkbox" class="form-check-input me-2" id="advanceToggle">
                                        <label for="advanceToggle" class="form-check-label">Enable</label>
                                    </div>

                                    <!-- Date Last Update -->
                                    <div class="mb-3">
                                        <label class="form-label">Date - Last Update</label>
                                        <input type="date" class="form-control">
                                    </div>

                                    <!-- Project Requirement Fields -->
                                    <div id="project-requirements">

                                        <!-- Project Name -->
                                        <div class="row mb-2 align-items-center">
                                            <div class="col-md-4">
                                                <input type="text" class="form-control" value="Project name" readonly>
                                            </div>
                                            <div class="col-md-2">
                                                <input type="text" class="form-control" value="text" readonly>
                                            </div>
                                            <div class="col-md-1 text-center">
                                                <input class="form-check-input" type="checkbox" checked>
                                            </div>
                                            <div class="col-md-2">
                                                <label>Required</label>
                                            </div>
                                            <div class="col-md-1">
                                                <button class="btn btn-outline-danger btn-sm">−</button>
                                            </div>
                                        </div>

                                        <!-- Slide -->
                                        <div class="row mb-2 align-items-center">
                                            <div class="col-md-4">
                                                <input type="text" class="form-control" value="Slide" readonly>
                                            </div>
                                            <div class="col-md-2">
                                                <input type="text" class="form-control" value="file" readonly>
                                            </div>
                                            <div class="col-md-1 text-center">
                                                <input class="form-check-input" type="checkbox" checked>
                                            </div>
                                            <div class="col-md-2">
                                                <label>Required</label>
                                            </div>
                                            <div class="col-md-1">
                                                <button class="btn btn-outline-danger btn-sm">−</button>
                                            </div>
                                        </div>

                                        <!-- Poster -->
                                        <div class="row mb-2 align-items-center">
                                            <div class="col-md-4">
                                                <input type="text" class="form-control" value="Poster" readonly>
                                            </div>
                                            <div class="col-md-2">
                                                <input type="text" class="form-control" value="file" readonly>
                                            </div>
                                            <div class="col-md-1 text-center">
                                                <input class="form-check-input" type="checkbox" checked>
                                            </div>
                                            <div class="col-md-2">
                                                <label>Required</label>
                                            </div>
                                            <div class="col-md-1">
                                                <button class="btn btn-outline-danger btn-sm">−</button>
                                            </div>
                                        </div>

                                        <!-- Penyelia -->
                                        <div class="row mb-3 align-items-center">
                                            <div class="col-md-4">
                                                <input type="text" class="form-control" value="Penyelia" readonly>
                                            </div>
                                            <div class="col-md-2">
                                                <input type="text" class="form-control" value="text" readonly>
                                            </div>
                                            <div class="col-md-1 text-center">
                                                <input class="form-check-input" type="checkbox" checked>
                                            </div>
                                            <div class="col-md-2">
                                                <label>Required</label>
                                            </div>
                                            <div class="col-md-1">
                                                <button class="btn btn-outline-danger btn-sm">−</button>
                                            </div>
                                        </div>

                                        <!-- Add new requirement row -->
                                        <div class="text-end mb-3">
                                            <button type="button" class="btn btn-outline-primary btn-sm">＋</button>
                                        </div>
                                    </div>

                                    <!-- Action Buttons -->
                                    <div class="d-flex justify-content-between">
                                        <button type="reset" class="btn btn-secondary">Reset Default</button>
                                        <div>
                                            <button type="button" class="btn btn-outline-light me-2">Preview</button>
                                            <button type="submit" class="btn btn-primary">Save</button>
                                        </div>
                                    </div>

                                </form>
